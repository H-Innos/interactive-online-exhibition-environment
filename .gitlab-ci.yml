# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/ee/user/application_security/secret_detection/pipeline/#customization
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence
default:
  image: node:22

stages:
  - test
  - deploy

test:
  stage: test
  image: cypress/browsers:node-22.11.0-chrome-130.0.6723.69-1-ff-132.0-edge-130.0.2849.56-1
  services:
    - name: postgres:16-alpine
      variables:
        POSTGRES_DB: local-db
        POSTGRES_PASSWORD: postgres
        POSTGRES_USER: postgres
  script:
  - apt-get update && apt-get install -y postgresql-client
  - npm install -g pnpm
  - pnpm install
  - psql -h postgres -U postgres -c "DROP DATABASE IF EXISTS \"local-db\";"
  - psql -h postgres -U postgres -c "CREATE DATABASE \"local-db\";"
  - psql -h postgres -U postgres -d "local-db" -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
  - psql -h postgres -U postgres -d "local-db" -c "DROP TABLE IF EXISTS \"interactive-online-exhibition-environment_post\" CASCADE;"
    - pnpm db:push --force --verbose
    - pnpm build
    - pnpm start &
    - npx wait-on http://localhost:3000
    - pnpm exec cypress run --browser chrome
    - pnpm exec cypress run --browser firefox
    - pnpm exec cypress run --browser edge
  variables:
    CYPRESS_baseUrl: http://localhost:3000
    DATABASE_URL: postgres://postgres:postgres@postgres:5432/local-db
  only:
    - merge_requests
    - branches

deploy:
  stage: deploy
  only:
    - main
  script:
    - npm install -g pnpm
    - pnpm install
    - npm install --global vercel
    - vercel pull --yes --environment=production --token=$VERCEL_TOKEN
    - vercel build --prod --token=$VERCEL_TOKEN
    - vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
    - pnpm db:push
  environment: production

include:
  - template: Jobs/SAST.gitlab-ci.yml
